[package]
name = "outrider-fetch"
version = "0.1.0"
edition = "2021"
description = "Resilient URL fetch + text extraction for outrider channels; pins the estate resilience stack (fetch-kit, breaker)"
license = "MIT"
authors = ["WyattAu"]
publish = false

[dependencies]
fetch-kit = { version = "=0.2.3", features = ["circuit-breaker"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
breaker = "2.0"
scraper = "0.20"
